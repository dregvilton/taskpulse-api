log_format taskpulse_json escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"component":"nginx",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$taskpulse_path",'
    '"status":$status,'
    '"duration":$request_time'
'}';

map $request_uri $taskpulse_limit_key {
    default $binary_remote_addr;
    ~^/health(?:\?|$) "";
}

map $request_uri $taskpulse_path {
    ~^([^?]*) $1;
    default $uri;
}

limit_req_zone $taskpulse_limit_key zone=taskpulse_api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    root /app/web;
    index index.php;

    charset utf-8;
    access_log /dev/stdout taskpulse_json;
    error_log /dev/stderr warn;
    add_header X-Request-Id $request_id always;
    error_page 429 = @rate_limited;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        limit_req zone=taskpulse_api burst=100 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_hide_header X-Request-Id;
        fastcgi_pass app:9000;
    }

    location ~ \.php$ {
        return 404;
    }

    location @rate_limited {
        default_type application/json;
        add_header X-Request-Id $request_id always;
        add_header Retry-After 1 always;
        return 429 '{"name":"Too Many Requests","message":"Слишком много запросов.","code":0,"status":429}';
    }

    location ~ /\. {
        deny all;
    }
}

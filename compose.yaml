name: taskpulse

services:
  app:
    image: taskpulse-app:latest
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
    environment:
      APP_COMPONENT: api
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  publisher:
    image: taskpulse-app:latest
    env_file:
      - .env
    environment:
      APP_COMPONENT: publisher
    volumes:
      - .:/app
    command: php yii task-event/run-publisher
    restart: unless-stopped
    stop_signal: SIGTERM
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: taskpulse-app:latest
    env_file:
      - .env
    environment:
      APP_COMPONENT: worker
    volumes:
      - .:/app
    command: php yii task-event/consume
    restart: unless-stopped
    stop_signal: SIGTERM
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DB_NAME:-taskpulse}"
      POSTGRES_USER: "${DB_USER:-taskpulse}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-taskpulse}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:${RABBITMQ_TAG:-4-management-alpine}
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-taskpulse}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-taskpulse}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

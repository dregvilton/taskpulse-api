openapi: 3.0.3
info:
  title: TaskPulse API
  version: 0.7.0
  description: |
    Каждый ответ содержит X-Request-Id для поиска соответствующих логов.
    Запросы API ограничиваются по IP; при превышении лимита возвращается 429.
    В production операции записи по умолчанию отключены и возвращают 403.
    Пользователи являются учётными записями. Защищённые маршруты принимают Bearer-токен.
    Токен действует один час и отзывается при выходе.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      tags: [Health]
      summary: Проверить состояние приложения
      responses:
        '200':
          description: Приложение, PostgreSQL, Redis и RabbitMQ доступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Одна из зависимостей недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /auth/login:
    post:
      security: []
      tags: [Auth]
      summary: Войти в API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: Токен доступа на один час
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Отозвать текущий токен
      responses:
        '204':
          description: Токен отозван
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /analytics/tasks:
    get:
      tags: [Analytics]
      summary: Получить аналитику задач
      description: |
        Учитываются неудалённые задачи, созданные в выбранный период. Число завершённых
        и процент выполнения относятся к той же выборке. Среднее время считается только
        по завершённым задачам; если их нет, возвращается null. Результат кешируется
        в Redis на 300 секунд и инвалидируется после изменения задачи через API.
        Событие задачи также доставляется через RabbitMQ для повторной инвалидации.
        Доступна только аналитика текущего пользователя; чужой authorId возвращает 403.
      parameters:
        - $ref: '#/components/parameters/AuthorId'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
      responses:
        '200':
          description: Агрегированные показатели задач
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAnalytics'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /users:
    get:
      tags: [Users]
      summary: Получить список из текущего пользователя
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Список пользователей
          headers:
            X-Pagination-Total-Count:
              schema:
                type: integer
            X-Pagination-Page-Count:
              schema:
                type: integer
            X-Pagination-Current-Page:
              schema:
                type: integer
            X-Pagination-Per-Page:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      security: []
      tags: [Users]
      summary: Зарегистрировать пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: Пользователь создан
          headers:
            Location:
              description: URL созданного пользователя
              schema:
                type: string
                example: /users/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/WritesDisabled'
        '429':
          $ref: '#/components/responses/RateLimited'
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Получить свой профиль
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [Users]
      summary: Обновить свой профиль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: Пользователь обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Users]
      summary: Удалить свой профиль и отозвать его токены
      responses:
        '204':
          description: Пользователь удалён
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /users/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Tasks]
      summary: Получить свои задачи
      parameters:
        - $ref: '#/components/parameters/Completed'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - $ref: '#/components/parameters/CompletedFrom'
        - $ref: '#/components/parameters/CompletedTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/TaskSort'
      responses:
        '200':
          $ref: '#/components/responses/TaskList'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tasks:
    get:
      tags: [Tasks]
      summary: Получить список своих задач
      parameters:
        - $ref: '#/components/parameters/AuthorId'
        - $ref: '#/components/parameters/Completed'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - $ref: '#/components/parameters/CompletedFrom'
        - $ref: '#/components/parameters/CompletedTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/TaskSort'
      responses:
        '200':
          $ref: '#/components/responses/TaskList'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Tasks]
      summary: Создать задачу
      description: |
        Заголовок Idempotency-Key необязателен. При повторе того же запроса с тем же
        ключом возвращаются исходные 201, Location и тело ответа, даже если задача
        позже была изменена. Тот же ключ с другим телом запроса возвращает 409.
        Ключи хранятся в PostgreSQL без срока действия; Redis для идемпотентности
        не используется. Изменение задачи и outbox-событие сохраняются в одной транзакции.
        Ключи изолированы по пользователю. Автором всегда становится текущий пользователь;
        переданный authorId игнорируется.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
      responses:
        '201':
          description: Задача создана или возвращён сохранённый ответ
          headers:
            Location:
              description: URL созданной задачи
              schema:
                type: string
                example: /tasks/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/WritesDisabled'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Получить свою задачу
      responses:
        '200':
          description: Задача
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [Tasks]
      summary: Обновить свою задачу
      description: |
        При изменении completed поле completedAt устанавливается или очищается автоматически.
        Изменение и outbox-событие сохраняются в одной транзакции.
        Автор задачи не изменяется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTask'
      responses:
        '200':
          description: Задача обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/WritesDisabled'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Tasks]
      summary: Удалить свою задачу
      description: Мягкое удаление и outbox-событие сохраняются в одной транзакции.
      responses:
        '204':
          description: Задача удалена
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WritesDisabled'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Уникальный ключ создания задачи. Повторно используйте только с тем же телом запроса.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '\S'
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AuthorId:
      name: authorId
      in: query
      description: Если указан, должен совпадать с ID текущего пользователя; иначе 403.
      schema:
        type: integer
        format: int64
        minimum: 1
    Completed:
      name: completed
      in: query
      schema:
        type: boolean
    CreatedFrom:
      name: createdFrom
      in: query
      schema:
        type: string
        format: date-time
    CreatedTo:
      name: createdTo
      in: query
      schema:
        type: string
        format: date-time
    CompletedFrom:
      name: completedFrom
      in: query
      schema:
        type: string
        format: date-time
    CompletedTo:
      name: completedTo
      in: query
      schema:
        type: string
        format: date-time
    TaskSort:
      name: sort
      in: query
      description: Поля id, title, completed, createdAt и completedAt. Префикс - задаёт сортировку по убыванию.
      schema:
        type: string
        default: -createdAt
  responses:
    Unauthorized:
      description: Токен отсутствует, недействителен или истёк
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Нет доступа к ресурсу или запись в публичном API отключена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    WritesDisabled:
      description: Запись в публичном API отключена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Превышен лимит запросов с IP-адреса
      headers:
        Retry-After:
          schema:
            type: integer
            example: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Ключ идемпотентности уже использован для другого запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Данные не прошли проверку
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ValidationError'
    TaskList:
      description: Список задач
      headers:
        X-Pagination-Total-Count:
          schema:
            type: integer
        X-Pagination-Page-Count:
          schema:
            type: integer
        X-Pagination-Current-Page:
          schema:
            type: integer
        X-Pagination-Per-Page:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskList'
  schemas:
    Login:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [tokenType, accessToken, expiresAt, userId]
      properties:
        tokenType:
          type: string
          enum: [Bearer]
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        userId:
          type: integer
          format: int64
    TaskAnalytics:
      type: object
      required: [totalCreated, totalCompleted, completionPercent, avgCompletionTimeSeconds]
      properties:
        totalCreated:
          type: integer
          minimum: 0
        totalCompleted:
          type: integer
          minimum: 0
        completionPercent:
          type: number
          format: double
          minimum: 0
          maximum: 100
        avgCompletionTimeSeconds:
          type: number
          format: double
          minimum: 0
          nullable: true
    Health:
      type: object
      required: [status, services]
      properties:
        status:
          type: string
          enum: [ok, error]
        services:
          type: object
          required: [app, postgres, redis, rabbitmq]
          properties:
            app:
              type: string
              enum: [ok]
            postgres:
              type: string
              enum: [ok, error]
            redis:
              type: string
              enum: [ok, error]
            rabbitmq:
              type: string
              enum: [ok, error]
    User:
      type: object
      required: [id, fullName, phone, email, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
          minLength: 3
          maxLength: 100
        phone:
          type: string
          nullable: true
          minLength: 10
          maxLength: 15
          pattern: '^\+\d{9,14}$'
        email:
          type: string
          format: email
          nullable: true
        createdAt:
          type: string
          example: '2026-08-28 12:00:00'
        updatedAt:
          type: string
          example: '2026-08-28 12:00:00'
    CreateUser:
      type: object
      required: [fullName, email, password]
      properties:
        fullName:
          type: string
          minLength: 3
          maxLength: 100
        phone:
          type: string
          nullable: true
          minLength: 10
          maxLength: 15
          pattern: '^\+\d{9,14}$'
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 255
    UpdateUser:
      type: object
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 3
          maxLength: 100
        phone:
          type: string
          nullable: true
          minLength: 10
          maxLength: 15
          pattern: '^\+\d{9,14}$'
    Task:
      type: object
      required: [id, authorId, title, description, completed, createdAt, updatedAt, completedAt]
      properties:
        id:
          type: integer
          format: int64
        authorId:
          type: integer
          format: int64
        title:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 5000
        completed:
          type: boolean
        createdAt:
          type: string
          example: '2026-09-03 12:00:00'
        updatedAt:
          type: string
          example: '2026-09-03 12:00:00'
        completedAt:
          type: string
          nullable: true
          example: '2026-09-03 13:00:00'
    CreateTask:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 5000
        completed:
          type: boolean
          default: false
    UpdateTask:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 5000
        completed:
          type: boolean
    TaskList:
      type: object
      required: [items, _links, _meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        _links:
          type: object
          additionalProperties:
            type: object
            required: [href]
            properties:
              href:
                type: string
        _meta:
          type: object
          required: [totalCount, pageCount, currentPage, perPage]
          properties:
            totalCount:
              type: integer
            pageCount:
              type: integer
            currentPage:
              type: integer
            perPage:
              type: integer
    UserList:
      type: object
      required: [items, _links, _meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        _links:
          type: object
          additionalProperties:
            type: object
            required: [href]
            properties:
              href:
                type: string
        _meta:
          type: object
          required: [totalCount, pageCount, currentPage, perPage]
          properties:
            totalCount:
              type: integer
            pageCount:
              type: integer
            currentPage:
              type: integer
            perPage:
              type: integer
    ValidationError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    Error:
      type: object
      required: [name, message, code, status]
      properties:
        name:
          type: string
        message:
          type: string
        code:
          type: integer
        status:
          type: integer

openapi: 3.0.3
info:
  title: TaskPulse API
  version: 0.2.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      tags: [Health]
      summary: Проверить состояние приложения
      responses:
        '200':
          description: Приложение и PostgreSQL доступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Одна из зависимостей недоступна
  /users:
    get:
      tags: [Users]
      summary: Получить список пользователей
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Список пользователей
          headers:
            X-Pagination-Total-Count:
              schema:
                type: integer
            X-Pagination-Page-Count:
              schema:
                type: integer
            X-Pagination-Current-Page:
              schema:
                type: integer
            X-Pagination-Per-Page:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Users]
      summary: Создать пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: Пользователь создан
          headers:
            Location:
              description: URL созданного пользователя
              schema:
                type: string
                example: /users/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Получить пользователя
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Обновить пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: Пользователь обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: Удалить пользователя
      responses:
        '204':
          description: Пользователь удалён
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Tasks]
      summary: Получить задачи пользователя
      parameters:
        - $ref: '#/components/parameters/Completed'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - $ref: '#/components/parameters/CompletedFrom'
        - $ref: '#/components/parameters/CompletedTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/TaskSort'
      responses:
        '200':
          $ref: '#/components/responses/TaskList'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks:
    get:
      tags: [Tasks]
      summary: Получить список задач
      parameters:
        - $ref: '#/components/parameters/AuthorId'
        - $ref: '#/components/parameters/Completed'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - $ref: '#/components/parameters/CompletedFrom'
        - $ref: '#/components/parameters/CompletedTo'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/TaskSort'
      responses:
        '200':
          $ref: '#/components/responses/TaskList'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Tasks]
      summary: Создать задачу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
      responses:
        '201':
          description: Задача создана
          headers:
            Location:
              description: URL созданной задачи
              schema:
                type: string
                example: /tasks/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Получить задачу
      responses:
        '200':
          description: Задача
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tasks]
      summary: Обновить задачу
      description: При изменении completed поле completedAt устанавливается или очищается автоматически.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTask'
      responses:
        '200':
          description: Задача обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Tasks]
      summary: Удалить задачу
      responses:
        '204':
          description: Задача удалена
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AuthorId:
      name: authorId
      in: query
      schema:
        type: integer
        format: int64
        minimum: 1
    Completed:
      name: completed
      in: query
      schema:
        type: boolean
    CreatedFrom:
      name: createdFrom
      in: query
      schema:
        type: string
        format: date-time
    CreatedTo:
      name: createdTo
      in: query
      schema:
        type: string
        format: date-time
    CompletedFrom:
      name: completedFrom
      in: query
      schema:
        type: string
        format: date-time
    CompletedTo:
      name: completedTo
      in: query
      schema:
        type: string
        format: date-time
    TaskSort:
      name: sort
      in: query
      description: Поля id, title, completed, createdAt и completedAt. Префикс - задаёт сортировку по убыванию.
      schema:
        type: string
        default: -createdAt
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Данные не прошли проверку
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ValidationError'
    TaskList:
      description: Список задач
      headers:
        X-Pagination-Total-Count:
          schema:
            type: integer
        X-Pagination-Page-Count:
          schema:
            type: integer
        X-Pagination-Current-Page:
          schema:
            type: integer
        X-Pagination-Per-Page:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskList'
  schemas:
    Health:
      type: object
      required: [status, services]
      properties:
        status:
          type: string
          enum: [ok, error]
        services:
          type: object
          required: [app, postgres]
          properties:
            app:
              type: string
              enum: [ok]
            postgres:
              type: string
              enum: [ok, error]
    User:
      type: object
      required: [id, fullName, phone, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
          minLength: 3
          maxLength: 100
        phone:
          type: string
          nullable: true
          minLength: 10
          maxLength: 15
          pattern: '^\+\d{9,14}$'
        createdAt:
          type: string
          example: '2026-08-28 12:00:00'
        updatedAt:
          type: string
          example: '2026-08-28 12:00:00'
    CreateUser:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
          minLength: 3
          maxLength: 100
        phone:
          type: string
          nullable: true
          minLength: 10
          maxLength: 15
          pattern: '^\+\d{9,14}$'
    UpdateUser:
      type: object
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 3
          maxLength: 100
        phone:
          type: string
          nullable: true
          minLength: 10
          maxLength: 15
          pattern: '^\+\d{9,14}$'
    Task:
      type: object
      required: [id, authorId, title, description, completed, createdAt, updatedAt, completedAt]
      properties:
        id:
          type: integer
          format: int64
        authorId:
          type: integer
          format: int64
        title:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 5000
        completed:
          type: boolean
        createdAt:
          type: string
          example: '2026-09-03 12:00:00'
        updatedAt:
          type: string
          example: '2026-09-03 12:00:00'
        completedAt:
          type: string
          nullable: true
          example: '2026-09-03 13:00:00'
    CreateTask:
      type: object
      required: [authorId, title]
      properties:
        authorId:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 5000
        completed:
          type: boolean
          default: false
    UpdateTask:
      type: object
      minProperties: 1
      properties:
        authorId:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 3
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 5000
        completed:
          type: boolean
    TaskList:
      type: object
      required: [items, _links, _meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        _links:
          type: object
          additionalProperties:
            type: object
            required: [href]
            properties:
              href:
                type: string
        _meta:
          type: object
          required: [totalCount, pageCount, currentPage, perPage]
          properties:
            totalCount:
              type: integer
            pageCount:
              type: integer
            currentPage:
              type: integer
            perPage:
              type: integer
    UserList:
      type: object
      required: [items, _links, _meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        _links:
          type: object
          additionalProperties:
            type: object
            required: [href]
            properties:
              href:
                type: string
        _meta:
          type: object
          required: [totalCount, pageCount, currentPage, perPage]
          properties:
            totalCount:
              type: integer
            pageCount:
              type: integer
            currentPage:
              type: integer
            perPage:
              type: integer
    ValidationError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    Error:
      type: object
      required: [name, message, code, status]
      properties:
        name:
          type: string
        message:
          type: string
        code:
          type: integer
        status:
          type: integer
